name: Sync Instagram feed

on:
  schedule:
    # كل 6 ساعات في الدقيقة 17 لتفادي ازدحام بداية الساعة.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instagram-feed-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync Instagram feed
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_HOST: ${{ vars.INSTAGRAM_API_HOST }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME }}
          INSTAGRAM_PROFILE_URL: ${{ vars.INSTAGRAM_PROFILE_URL }}
        run: node scripts/sync-instagram-feed.mjs

      - name: Commit changed feed data
        run: |
          if git diff --quiet -- src/data/instagram-feed.json; then
            echo "Instagram feed is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/instagram-feed.json
          git commit -m "chore: sync Instagram feed"
          git push

      - name: Deploy site with refreshed feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nextjs.yml --repo "$GITHUB_REPOSITORY" --ref main
