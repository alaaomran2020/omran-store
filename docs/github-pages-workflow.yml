name: نشر الموقع على GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

# إلغاء أي نشر سابق عند وصول دفعة جديدة للفرع نفسه
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: الفحوصات (الأنواع + الاختبارات)
        run: |
          npm run typecheck
          npm test

      - name: بناء التصدير الثابت
        run: npm run build

      - name: إعداد الصفحات
        uses: actions/configure-pages@v5

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: النشر على GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
